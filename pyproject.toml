[project]
name = "clouddesk"
version = "0.1.0"
description = "CloudDesk — Autonomous Customer Support & Resolution Platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.121.0",
    "greenlet>=3.5.6",
    "langchain>=1.4.9",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

